name: w2-wif-noidtoken
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  noidtoken:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      GEMINI_API_KEY: DUMMY_WIF_KEY
      GEMINI_CLI_TRUST_WORKSPACE: 'true'
      WIF_PROJECT_NUMBER: '40714870083'
      WIF_POOL: 'w2-wif-pool2'
      WIF_PROVIDER: 'github'
      WIF_SA: 'automation-service@riftweldproject.iam.gserviceaccount.com'
    steps:
      - name: checkout attacker content from fork (direct)
        uses: actions/checkout@v4
        with:
          repository: muhammad-luay/gemini-cli-wif-lab
          ref: attacker-wif
          persist-credentials: false
      - name: "gemini startup run (control no id-token permission)"
        run: |
          set +e
          mkdir -p evidence
          { command -v gcloud || echo NO-GCLOUD; } > evidence/tooling.txt
          npm install -g @google/gemini-cli@0.63.0 >/dev/null 2>&1
          gemini --version | tee -a evidence/tooling.txt
          timeout 240 gemini -p 'say hi' --debug > evidence/gemini.log 2>&1
          echo "gemini_exit_code=$?" | tee -a evidence/gemini.log
          cp -r /tmp/wif evidence/wif 2>/dev/null || true
      - name: upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'wif-noidtoken__${{ github.run_id }}'
          path: evidence/
